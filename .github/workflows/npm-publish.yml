name: Publish npm package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Verify package version matches Git tag
              run: |
                  package_version="$(node -p "require('./package.json').version")"
                  lock_version="$(node -p "require('./package-lock.json').version")"
                  tag_version="${GITHUB_REF_NAME#v}"

                  if [ "$package_version" != "$lock_version" ]; then
                      echo "::error::package.json version ($package_version) does not match package-lock.json version ($lock_version)"
                      exit 1
                  fi

                  if [ "$package_version" != "$tag_version" ]; then
                      echo "::error::package.json version ($package_version) does not match Git tag (${GITHUB_REF_NAME})"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build package
              run: npm run build

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Publish package
              run: npm publish --provenance
